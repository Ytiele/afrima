<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openroom — consulting rooms that never close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="openroom.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  "use strict";

  var app = document.getElementById("app");

  // ---- room + connection config -------------------------------------------
  var params = new URLSearchParams(location.search);
  var ROOM = (params.get("room") || "main").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40) || "main";
  var HOST_ID = "openroom-" + ROOM + "-host";
  var SHARE_URL = location.origin + location.pathname + (ROOM === "main" ? "" : "?room=" + ROOM);

  // Two strangers on two different networks essentially never connect on
  // STUN alone — one of them is behind a NAT/firewall that blocks a direct
  // path often enough that a TURN relay is what actually makes "different
  // locations" work, not an edge case. STATIC_ICE_SERVERS below (a public,
  // shared relay) is the fallback; this is our own private Metered.live
  // relay, used first. Its domain and key are public in the page source by
  // design — Metered's credentials endpoint is meant to be called from the
  // browser — but that does mean anyone who inspects the source could draw
  // on the account's quota, so rotate the key from the Metered dashboard if
  // that ever becomes a problem.
  var TURN_PROVIDER = { domain: "afrima.metered.live", key: "4DoOeTEPK_F3uaasTeh40-J0jE43uSnMUA9CiPiIjC23atIa" };

  var STATIC_ICE_SERVERS = [
    { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun.cloudflare.com:3478"] },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ];

  // Fetched once per page load (Metered's credentials are short-lived tokens,
  // not secrets worth hiding — they only ever grant relay usage) and reused
  // for every Peer this tab creates, including retries. Any failure (no key
  // configured, network hiccup, slow response) quietly falls back to the
  // static list above, so this can never be the thing that breaks a call.
  var iceServersPromise = null;
  function getIceServers(){
    if (iceServersPromise) return iceServersPromise;
    if (!TURN_PROVIDER.domain || !TURN_PROVIDER.key){
      iceServersPromise = Promise.resolve(STATIC_ICE_SERVERS);
      return iceServersPromise;
    }
    var url = "https://" + TURN_PROVIDER.domain + "/api/v1/turn/credentials?apiKey=" + encodeURIComponent(TURN_PROVIDER.key);
    iceServersPromise = new Promise(function(resolve){
      var done = false;
      var settle = function(v){ if (!done){ done = true; resolve(v); } };
      setTimeout(function(){ settle(STATIC_ICE_SERVERS); }, 5000);
      fetch(url).then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("bad response")); })
        .then(function(servers){
          settle((Array.isArray(servers) && servers.length) ? servers.concat(STATIC_ICE_SERVERS[0]) : STATIC_ICE_SERVERS);
        })
        .catch(function(){ settle(STATIC_ICE_SERVERS); });
    });
    return iceServersPromise;
  }

  var SECURE = (window.isSecureContext !== false) && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  var LIB_OK = (typeof Peer !== "undefined");

  // Nothing should ever hang forever on a bad network: these bound how long
  // we wait before retrying (fresh ICE gathering sometimes just gets luckier)
  // and how many attempts we make before telling the person plainly.
  var CONNECT_TIMEOUT_MS = 12000, MAX_CONNECT_RETRIES = 2;
  var JOIN_TIMEOUT_MS = 12000, MAX_JOIN_RETRIES = 2;

  // ---- helpers ----------------------------------------------------------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function initials(n){
    var p = String(n || "").replace(/^Dr\.?\s*/i, "").trim().split(/\s+/).slice(0, 2);
    return p.map(function(w){ return w[0] || ""; }).join("").toUpperCase() || "–";
  }
  function first(n){ return String(n || "").replace(/^Dr\.?\s*/i, "").trim().split(/\s+/)[0] || "your practitioner"; }
  function mmss(s){ s = Math.max(0, s | 0); return Math.floor(s/60) + ":" + String(s%60).padStart(2, "0"); }
  function avatarHtml(name, size, kind){
    var bg = kind === "accent" ? "var(--color-accent-200)" : "var(--color-accent-2-200)";
    var fg = kind === "accent" ? "var(--color-accent-800)" : "var(--color-accent-2-800)";
    return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;background:' + bg +
      ';color:' + fg + ';font-size:' + Math.round(size * 0.34) + 'px">' + esc(initials(name)) + '</div>';
  }

  // ---- shared local camera/mic ---------------------------------------------
  var mediaP = null, mediaErr = false;
  function getMedia(){
    if (mediaP) return mediaP;
    mediaP = navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .catch(function(){ return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); })
      .catch(function(){ mediaErr = true; return null; });
    return mediaP;
  }
  function localStreamOf(o){ return o ? o.stream : null; }
  function applyToggles(){
    var o = host || pt; if (!o || !o.stream) return;
    o.stream.getAudioTracks().forEach(function(t){ t.enabled = !o.muted; });
    o.stream.getVideoTracks().forEach(function(t){ t.enabled = !o.camOff; });
  }

  // ---- session ---------------------------------------------------------
  var PROFS = ["General practitioner", "Nutritionist", "Therapist / counsellor", "Paediatrician"];
  var SEEK_OPTIONS = ["Any available practitioner"].concat(PROFS);
  var S = { screen: "landing", role: "patient", name: "", profession: "General practitioner",
            title: "General practitioner", langs: "English, Swahili", seek: SEEK_OPTIONS[0], err: "", toast: "",
            demo: false };
  var host = null;   // practitioner runtime
  var pt = null;     // patient runtime
  var noteDraft = "";

  // ---- demo mode: a local, network-free stand-in for the other side, so
  // the UI can be built and reviewed without two devices, PeerJS or TURN ----
  var DEMO_PATIENTS = [
    { name: "Aisha Karanja", seek: "Nutritionist", reason: "Follow-up on meal plan" },
    { name: "Brian Otieno", seek: "General practitioner", reason: "Persistent cough" },
    { name: "Grace Wanjiru", seek: "Any available practitioner", reason: "First visit" }
  ];
  var DEMO_HOST_NOTES = [
    "Thanks for sharing that — noted.",
    "Let's keep an eye on this over the next week.",
    "I'll follow up with a summary once we wrap up."
  ];
  var DEMO_PRACTITIONER = { name: "Dr. Amina Wekesa", title: "General practitioner" };
  var DEMO_PATIENT_NOTES = [
    "Sleeping about 6–7 hours a night, some improvement.",
    "Recommend cutting back on caffeine after 3pm.",
    "Let's follow up again in two weeks if symptoms persist."
  ];

  // ============================ HOST ===================================
  function startHost(){
    host = {
      peer: null, ready: false, err: "", tries: 0,
      stream: undefined, muted: false, camOff: false, onBreak: false,
      clients: {}, queue: [], currentId: null, currentName: "", currentCall: null,
      remoteStream: null, notes: [], callStart: 0
    };
    S.screen = "host"; render();
    getMedia().then(function(s){ host.stream = s; applyToggles(); pump(); render(); });
    makeHostPeer();
  }
  function startDemoHost(){
    host = {
      peer: null, ready: true, err: "", tries: 0, demo: true,
      stream: undefined, muted: false, camOff: false, onBreak: false,
      clients: {}, queue: [], currentId: null, currentName: "", currentCall: null,
      remoteStream: null, notes: [], callStart: 0
    };
    S.screen = "host"; render();
    getMedia().then(function(s){ host.stream = s; applyToggles(); render(); });
    scheduleDemoArrival(3000);
  }
  function scheduleDemoArrival(delay){
    if (!host) return;
    clearTimeout(host._demoT);
    host._demoT = setTimeout(function(){
      if (!host || !host.demo) return;
      if (host.onBreak || host.currentId){ scheduleDemoArrival(2000); return; }
      var p = DEMO_PATIENTS[Math.floor(Math.random() * DEMO_PATIENTS.length)];
      var id = "demo-" + Date.now();
      host.clients[id] = { id: id, name: p.name, seek: p.seek, conn: { open: false, send: function(){} }, at: Date.now() };
      host.queue.push(id);
      render();
      clearTimeout(host._demoAdmitT);
      host._demoAdmitT = setTimeout(demoAdmitNext, 1600);
    }, delay);
  }
  function demoAdmitNext(){
    if (!host || !host.demo || host.onBreak || host.currentId) return;
    var id = host.queue.shift();
    var e = id && host.clients[id];
    if (!e) return;
    host.currentId = e.id; host.currentName = e.name; host.notes = []; host.callStart = Date.now();
    render();
    scheduleDemoHostNote();
  }
  function scheduleDemoHostNote(){
    if (!host) return;
    clearTimeout(host._demoNoteT);
    if (!host.demo || !host.currentId) return;
    host._demoNoteT = setTimeout(function(){
      if (!host || !host.currentId || host.notes.length >= DEMO_HOST_NOTES.length) return;
      var at = mmss(Math.floor((Date.now() - host.callStart) / 1000));
      host.notes.push({ at: at, text: DEMO_HOST_NOTES[host.notes.length] });
      render();
      scheduleDemoHostNote();
    }, 5000);
  }
  function clearHostDemoTimers(){
    if (!host) return;
    clearTimeout(host._demoT); clearTimeout(host._demoAdmitT); clearTimeout(host._demoNoteT);
  }
  function makeHostPeer(){
    getIceServers().then(function(iceServers){
      if (!host) return;   // room was closed while credentials were loading
      var p = new Peer(HOST_ID, { config: { iceServers: iceServers }, debug: 1 });
      bindHostPeer(p);
    });
  }
  function bindHostPeer(p){
    host.peer = p;
    p.on("open", function(){ host.ready = true; host.err = ""; host.tries = 0; render(); pump(); startHeartbeat(); });
    p.on("connection", hostOnConn);
    p.on("disconnected", function(){ try { p.reconnect(); } catch (e) {} });
    p.on("error", function(e){
      if (e && e.type === "unavailable-id"){
        host.tries++;
        if (host.tries <= 6){
          host.err = "Reclaiming the room… (" + host.tries + ")";
          render();
          setTimeout(function(){ try { host.peer.destroy(); } catch (x) {} makeHostPeer(); }, 3000);
        } else {
          host.err = "Another practitioner already holds room “" + ROOM + "”. Ask them to close their tab, or add ?room=NAME to the link for a separate room.";
          render();
        }
      } else if (e && (e.type === "network" || e.type === "server-error" || e.type === "socket-error")){
        host.err = "Signalling connection dropped — retrying…"; render();
      } else {
        console.warn("[host]", e && e.type, e);
      }
    });
  }
  function hostOnConn(conn){
    conn.on("open", function(){
      host.clients[conn.peer] = { id: conn.peer, name: (conn.metadata && conn.metadata.name) || "Patient",
        seek: (conn.metadata && conn.metadata.seek) || "", conn: conn, at: Date.now() };
      try { conn.send({ t: "hello", name: S.name, title: S.title }); } catch (e) {}
      if (host.currentId !== conn.peer && host.queue.indexOf(conn.peer) < 0) host.queue.push(conn.peer);
      pump(); render();
    });
    conn.on("data", function(d){
      if (!d) return;
      if (d.t === "bye") hostDrop(conn.peer);
      else if (d.t === "retry-call" && host.currentId === conn.peer) placeCall(conn.peer);
    });
    conn.on("close", function(){ hostDrop(conn.peer); });
    conn.on("error", function(){ hostDrop(conn.peer); });
  }
  // Re-placing the call re-uses the SAME admitted patient — it's how a
  // patient whose video failed to connect (their own watchdog asked for
  // this over the still-open data channel) gets another shot without being
  // sent back to the end of the queue.
  function placeCall(id){
    var e = host.clients[id]; if (!e) return;
    try { host.currentCall && host.currentCall.close(); } catch (x) {}
    var call = host.peer.call(id, host.stream || new MediaStream());
    host.currentCall = call;
    if (call){
      call.on("stream", function(rs){ host.remoteStream = rs; render(); });
      call.on("error", function(){});
    }
  }
  // ---- admin dashboard link: heartbeat + remote commands ------------------
  // Real rooms only -- demo is a local fiction and has nothing to report.
  function heartbeatSnapshot(){
    return {
      room: ROOM,
      practitioner: { name: S.name, title: S.title },
      onBreak: host.onBreak,
      current: host.currentId ? {
        id: host.currentId, name: host.currentName,
        seek: (host.clients[host.currentId] && host.clients[host.currentId].seek) || "",
        callStart: host.callStart
      } : null,
      queue: host.queue.map(function(id){
        var e = host.clients[id];
        return e ? { id: id, name: e.name, seek: e.seek || "", at: e.at } : null;
      }).filter(Boolean)
    };
  }
  function sendHeartbeat(){
    if (!host || host.demo || !host.peer) return;
    fetch("/api/heartbeat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(heartbeatSnapshot())
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.command) applyAdminCommand(j.command);
    }).catch(function(){});
  }
  function startHeartbeat(){
    if (!host || host.demo) return;
    clearInterval(host._hbT);
    sendHeartbeat();
    host._hbT = setInterval(sendHeartbeat, 4000);
  }
  function stopHeartbeat(){ if (host) clearInterval(host._hbT); }
  function logCompletedCall(patientName, seek, startedAt){
    if (!host || host.demo || !startedAt) return;
    fetch("/api/log-call", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room: ROOM, practitioner: S.name, title: S.title,
        patientName: patientName, seek: seek, startedAt: startedAt, endedAt: Date.now()
      })
    }).catch(function(){});
  }
  function applyAdminCommand(c){
    if (!host || !c) return;
    if (c.cmd === "end-call") hostEndConsult();
    else if (c.cmd === "remove-queued" && c.targetId){
      if (host.currentId === c.targetId){ hostEndConsult(); return; }
      var e = host.clients[c.targetId];
      if (e){
        try { e.conn.send({ t: "removed" }); } catch (x) {}
        try { e.conn.close && e.conn.close(); } catch (x) {}
      }
      host.queue = host.queue.filter(function(id){ return id !== c.targetId; });
      delete host.clients[c.targetId];
      sendPositions(); render();
    }
    else if (c.cmd === "close-room") forceCloseRoom();
  }
  function forceCloseRoom(){
    if (!host) return;
    stopHeartbeat();
    try { host.currentCall && host.currentCall.close(); } catch (x) {}
    try { host.peer && host.peer.destroy(); } catch (x) {}
    host.forcedClosed = true; render();
  }

  function pump(){
    if (!host || !host.ready || host.stream === undefined) return;
    if (host.onBreak || host.currentId){ sendPositions(); return; }
    var id = host.queue.shift();
    if (!id){ render(); return; }
    var e = host.clients[id];
    if (!e){ return pump(); }
    host.currentId = e.id; host.currentName = e.name; host.notes = []; host.callStart = Date.now();
    try { e.conn.send({ t: "admit" }); } catch (x) {}
    placeCall(e.id);
    sendPositions(); render(); sendHeartbeat();
  }
  function sendPositions(){
    host.queue.forEach(function(id, i){
      var e = host.clients[id];
      if (e && e.conn.open){ try { e.conn.send({ t: "pos", pos: i + 1 }); } catch (x) {} }
    });
  }
  function hostDrop(id){
    if (!host) return;
    var wasCurrent = host.currentId === id;
    var seek = (host.clients[id] && host.clients[id].seek) || "";
    delete host.clients[id];
    host.queue = host.queue.filter(function(x){ return x !== id; });
    if (wasCurrent){
      logCompletedCall(host.currentName, seek, host.callStart);
      try { host.currentCall && host.currentCall.close(); } catch (x) {}
      host.currentId = null; host.currentName = ""; host.currentCall = null; host.remoteStream = null; host.notes = [];
      if (!host.onBreak) pump();
    }
    sendPositions(); render(); sendHeartbeat();
  }
  function hostEndConsult(){
    if (!host || !host.currentId) return;
    var e = host.clients[host.currentId];
    var seek = e ? e.seek : "";
    if (e && e.conn.open){
      try { e.conn.send({ t: "end", notes: host.notes.slice(), duration: Date.now() - host.callStart }); } catch (x) {}
    }
    try { host.currentCall && host.currentCall.close(); } catch (x) {}
    logCompletedCall(host.currentName, seek, host.callStart);
    host.currentId = null; host.currentName = ""; host.currentCall = null; host.remoteStream = null; host.notes = [];
    render(); sendHeartbeat();
    setTimeout(function(){
      if (host && host.demo) scheduleDemoArrival(2500); else pump();
      render();
    }, 500);
  }
  function hostSendNote(text){
    if (!host || !host.currentId) return;
    var at = mmss(Math.floor((Date.now() - host.callStart) / 1000));
    host.notes.push({ at: at, text: text });
    var e = host.clients[host.currentId];
    if (e && e.conn.open){ try { e.conn.send({ t: "note", at: at, text: text }); } catch (x) {} }
    noteDraft = ""; render();
  }
  function hostSetBreak(on){
    host.onBreak = on;
    if (on) hostEndConsult();
    else if (host.demo) scheduleDemoArrival(1500);
    else pump();
    render(); sendHeartbeat();
  }

  // ========================== PATIENT =================================
  function startPatient(){
    pt = {
      peer: null, conn: null, currentCall: null,
      stream: undefined, muted: false, camOff: false, remoteStream: null,
      phase: "connecting", pos: 0, practitioner: { name: "", title: "" },
      notes: [], finalNotes: null, callStart: 0, lastDuration: 0, endReason: "",
      connectTries: 0, joinTries: 0, slow: false, joinSlow: false
    };
    S.screen = "patient"; render();
    getMedia().then(function(s){ pt.stream = s; applyToggles(); connectPatient(); render(); });
  }
  function startDemoPatient(){
    pt = {
      peer: null, conn: null, currentCall: null, demo: true,
      stream: undefined, muted: false, camOff: false, remoteStream: null,
      phase: "waiting", pos: 1, practitioner: { name: DEMO_PRACTITIONER.name, title: DEMO_PRACTITIONER.title },
      notes: [], finalNotes: null, callStart: 0, lastDuration: 0, endReason: "",
      connectTries: 0, joinTries: 0, slow: false, joinSlow: false
    };
    S.screen = "patient"; render();
    getMedia().then(function(s){ pt.stream = s; applyToggles(); render(); });
    clearTimeout(pt._demoAdmitT);
    pt._demoAdmitT = setTimeout(function(){
      if (!pt || !pt.demo || pt.phase !== "waiting") return;
      pt.phase = "live"; pt.callStart = Date.now();
      render();
      scheduleDemoPatientNote();
    }, 4000);
  }
  function scheduleDemoPatientNote(){
    if (!pt) return;
    clearTimeout(pt._demoNoteT);
    if (!pt.demo || pt.phase !== "live") return;
    pt._demoNoteT = setTimeout(function(){
      if (!pt || pt.phase !== "live" || pt.notes.length >= DEMO_PATIENT_NOTES.length) return;
      var at = mmss(Math.floor((Date.now() - pt.callStart) / 1000));
      pt.notes.push({ at: at, text: DEMO_PATIENT_NOTES[pt.notes.length] });
      render();
      scheduleDemoPatientNote();
    }, 5000);
  }
  function clearPtTimers(){
    if (!pt) return;
    clearTimeout(pt._demoAdmitT); clearTimeout(pt._demoNoteT);
    clearTimeout(pt._connSlow); clearTimeout(pt._connGiveup);
    clearTimeout(pt._joinSlow); clearTimeout(pt._joinGiveup);
    clearTimeout(pt._t);
  }
  function connectPatient(){
    pt.connectTries++;
    pt.slow = false;
    clearTimeout(pt._connSlow); clearTimeout(pt._connGiveup);
    // A stuck ICE negotiation often never fires an error event at all — it
    // just never opens. A plain timer is the only reliable way to notice.
    pt._connSlow = setTimeout(function(){ if (pt && pt.phase === "connecting"){ pt.slow = true; render(); } }, 5000);
    pt._connGiveup = setTimeout(function(){
      if (!pt || pt.phase !== "connecting") return;
      try { pt.peer && pt.peer.destroy(); } catch (x) {}
      if (pt.connectTries <= MAX_CONNECT_RETRIES) connectPatient();
      else { pt.phase = "connect-failed"; render(); }
    }, CONNECT_TIMEOUT_MS);

    var startedFor = pt, myTry = pt.connectTries;
    getIceServers().then(function(iceServers){
      // Superseded by a retry or a leave while the (cached-after-first-time)
      // credential lookup was in flight -- let that newer attempt own the peer.
      if (pt !== startedFor || pt.connectTries !== myTry || pt.phase !== "connecting") return;
      bindPatientPeer(new Peer({ config: { iceServers: iceServers }, debug: 1 }));
    });
  }
  function bindPatientPeer(p){
    pt.peer = p;
    p.on("open", function(){
      var conn;
      try { conn = p.connect(HOST_ID, { metadata: { name: S.name, seek: S.seek }, reliable: true }); }
      catch (x) { return; }
      pt.conn = conn;
      conn.on("open", function(){
        clearTimeout(pt._connSlow); clearTimeout(pt._connGiveup);
        if (pt.phase === "connecting"){ pt.phase = "waiting"; pt.connectTries = 0; pt.slow = false; }
        render();
      });
      conn.on("data", ptOnData);
      conn.on("close", function(){
        if (pt.phase !== "ended"){
          clearPtTimers();
          pt.finalNotes = pt.finalNotes || pt.notes.slice();
          pt.endReason = pt.endReason || "The connection to the room closed.";
          pt.phase = "ended"; render();
        }
      });
      conn.on("error", function(){});
    });
    p.on("call", function(call){
      pt.currentCall = call;
      call.answer(pt.stream || new MediaStream());
      call.on("stream", function(rs){
        clearTimeout(pt._joinSlow); clearTimeout(pt._joinGiveup);
        pt.remoteStream = rs; if (!pt.callStart) pt.callStart = Date.now();
        pt.phase = "live"; render();
      });
      call.on("close", function(){
        if (pt.phase === "live"){ pt.finalNotes = pt.finalNotes || pt.notes.slice(); pt.endReason = pt.endReason || "The practitioner ended the call."; pt.phase = "ended"; render(); }
      });
      call.on("error", function(){});
    });
    p.on("error", function(e){
      if (e && e.type === "peer-unavailable"){
        clearTimeout(pt._connSlow); clearTimeout(pt._connGiveup);
        pt.phase = "no-host"; render();
        clearTimeout(pt._t);
        pt._t = setTimeout(function(){ if (pt && pt.phase === "no-host") rejoinPatient(); }, 5000);
      } else if (e && (e.type === "network" || e.type === "server-error")){
        if (pt.phase !== "live" && pt.phase !== "waiting" && pt.phase !== "joining"){ pt.phase = "no-host"; render(); }
      } else {
        console.warn("[patient]", e && e.type, e);
      }
    });
  }
  // After being admitted, the video call is a SEPARATE WebRTC connection from
  // the (already-open) data channel — it can fail on its own even though
  // everything up to here worked. This watchdog notices and asks the
  // practitioner to re-place the call over that still-open data channel,
  // without either side having to restart from scratch.
  function startJoinWatchdog(){
    pt.joinTries++;
    pt.joinSlow = false;
    clearTimeout(pt._joinSlow); clearTimeout(pt._joinGiveup);
    pt._joinSlow = setTimeout(function(){ if (pt && pt.phase === "joining"){ pt.joinSlow = true; render(); } }, 5000);
    pt._joinGiveup = setTimeout(function(){
      if (!pt || pt.phase !== "joining") return;
      if (pt.joinTries <= MAX_JOIN_RETRIES){
        try { pt.conn && pt.conn.open && pt.conn.send({ t: "retry-call" }); } catch (x) {}
        startJoinWatchdog();
      } else {
        pt.phase = "join-failed"; render();
        try { pt.conn && pt.conn.open && pt.conn.send({ t: "bye" }); } catch (x) {}
      }
    }, JOIN_TIMEOUT_MS);
  }
  function ptOnData(d){
    if (!d) return;
    if (d.t === "hello"){ pt.practitioner = { name: d.name || "", title: d.title || "" }; render(); }
    else if (d.t === "pos"){ pt.pos = d.pos; if (pt.phase === "waiting") render(); }
    else if (d.t === "admit"){
      if (pt.phase === "waiting"){ pt.phase = "joining"; pt.joinTries = 0; startJoinWatchdog(); render(); }
    }
    else if (d.t === "note"){ pt.notes.push({ at: d.at, text: d.text }); render(); }
    else if (d.t === "end"){
      clearPtTimers();
      pt.finalNotes = ((d.notes && d.notes.length) ? d.notes : pt.notes).slice();
      pt.lastDuration = d.duration || (pt.callStart ? Date.now() - pt.callStart : 0);
      pt.endReason = "The practitioner ended the call.";
      pt.phase = "ended"; render();
      try { pt.conn && pt.conn.close(); } catch (x) {}
    }
    else if (d.t === "removed"){
      clearPtTimers();
      pt.finalNotes = pt.notes.slice();
      pt.endReason = "You were removed from the queue.";
      pt.phase = "ended"; render();
      try { pt.conn && pt.conn.close(); } catch (x) {}
    }
  }
  function ptHangUp(){
    clearPtTimers();
    try { pt.conn && pt.conn.open && pt.conn.send({ t: "bye" }); } catch (x) {}
    try { pt.currentCall && pt.currentCall.close(); } catch (x) {}
    pt.lastDuration = pt.callStart ? Date.now() - pt.callStart : 0;
    pt.finalNotes = pt.notes.slice();
    pt.endReason = "You left the call.";
    pt.phase = "ended"; render();
  }

        '<div style="display:flex;align-items:center;gap:var(--space-2)">' +
          '<span class="' + (host.onBreak ? '' : 'dot-pulse') + '" style="width:9px;height:9px;border-radius:50%;background:' +
            (host.onBreak ? 'var(--color-neutral-400)' : 'var(--color-accent-2-600)') + '"></span>' +
          '<span class="card-kicker" style="color:var(--color-accent-2-700)">' + (host.onBreak ? "On a break" : "Room open") + '</span></div>' +
        '<h3 style="margin:0;max-width:24ch">' + (host.onBreak ? "Your room is closed" : (waitingCount ? "Admitting the next patient…" : "Waiting for a patient")) + '</h3>' +
        '<p class="card-body" style="margin:0;max-width:42ch;flex:none">' +
          (host.onBreak
            ? "Patients can open the link but can’t join until you reopen. Anyone already waiting keeps their place."
            : "Your camera is on and the room is live at the link below. The moment someone joins, you’re connected.") + '</p>' +
        (host.onBreak
          ? '<button class="btn btn-primary" style="min-height:44px" data-act="host-open">Reopen the room</button>'
          : '') +
      '</div>';
    }

    var notesPanel = host.currentId
      ? '<div class="card elev-sm" style="padding:var(--space-4);gap:var(--space-3)">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap">' +
            '<div><div class="card-kicker">Live notes</div><h3 style="margin:0;font-size:18px">Notes for ' + esc(first(host.currentName)) + '</h3></div>' +
            '<span class="tag tag-accent-2">Streamed to the patient</span></div>' +
          notesList(host.notes, "Nothing sent yet. What you type appears on the patient’s screen instantly and is theirs to keep when the call ends.") +
          '<form class="js-note-form" style="display:flex;gap:var(--space-2)">' +
            '<input class="js-note-input input" autocomplete="off" placeholder="Type a note and press Enter" value="' + esc(noteDraft) + '" />' +
            '<button class="btn btn-primary" type="submit" style="min-height:44px">Send</button></form>' +
        '</div>'
      : '';

    return navBar(right) +
    (host.err ? '<div class="wrap" style="padding:0 var(--space-6)"><div class="banner banner-warn" style="margin-bottom:var(--space-4)">' + esc(host.err) + '</div></div>' : '') +
    '<div class="wrap" style="padding:var(--space-3) var(--space-6) var(--space-8)">' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)">' +
        '<div style="display:flex;align-items:center;gap:var(--space-3)">' + avatarHtml(S.name, 56, "accent2") +
          '<div><h6 style="color:var(--color-accent-700);margin-bottom:var(--space-1)">' + esc(S.title || "Practitioner") + '</h6>' +
          '<h2 style="margin:0">' + esc(S.name || "Your room") + '</h2></div></div>' +
        '<div style="display:flex;align-items:center;gap:var(--space-2)">' + status +
          (host.ready && !host.currentId
            ? (host.onBreak
                ? ''
                : '<button class="btn btn-secondary" data-act="host-break">Take a break</button>')
            : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start">' +
        '<div style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' + stage + notesPanel + '</div>' +
        '<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
          (host.demo
            ? '<div class="card" style="gap:var(--space-2)"><div class="card-kicker">Demo mode</div>' +
              '<p class="card-body" style="margin:0">This isn’t a real room — the link below won’t connect anyone. Leave the demo to open a real one.</p></div>'
            : shareRow()) +
          '<div class="card" style="padding:var(--space-4);gap:var(--space-3)">' +
            '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)">' +
              '<div class="card-title" style="font-size:15px">Waiting</div>' +
              '<span class="tag tag-accent">' + waitingCount + ' in line</span></div>' + waitRows +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // --------------------------- patient -------------------------------
  function viewPatient(){
    var right = '<span class="tag tag-accent-2">' + esc(S.name || "Patient") + '</span>' +
      '<button class="btn btn-secondary" data-act="leave">Leave</button>';
    var pr = pt.practitioner || { name: "", title: "" };
    var fn = first(pr.name);

    if (pt.phase === "connecting"){
      return navBar(right) + centered(
        '<div class="card-kicker">Connecting</div>' +
        '<h2 style="margin:0">Reaching the room…</h2>' +
        '<p class="card-body" style="margin:0">Setting up your camera and the secure connection.' +
          (pt.slow ? ' This is taking longer than usual on your network — still trying…' : '') + '</p>');
    }
    if (pt.phase === "connect-failed"){
      return navBar(right) + centered(
        '<div class="card-kicker">Couldn’t connect</div>' +
        '<h2 style="margin:0">We couldn’t reach the room</h2>' +
        '<p class="card-body" style="margin:0">This is usually a restrictive Wi-Fi, firewall, or VPN blocking the connection. Try switching to mobile data or a different network, then try again.</p>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2)">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-rejoin">Try again</button>' +
          '<button class="btn btn-secondary" style="min-height:44px" data-act="leave">Leave</button></div>');
    }
    if (pt.phase === "joining"){
      return navBar(right) + centered(
        '<div class="card-kicker">Almost there</div>' +
        '<h2 style="margin:0">Connecting your video…</h2>' +
        '<p class="card-body" style="margin:0">' + esc(fn) + ' has admitted you — setting up the call.' +
          (pt.joinSlow ? ' Still trying — this can take longer on some networks.' : '') + '</p>');
    }
    if (pt.phase === "join-failed"){
      return navBar(right) + centered(
        '<div class="card-kicker">Video didn’t connect</div>' +
        '<h2 style="margin:0">We couldn’t set up the call</h2>' +
        '<p class="card-body" style="margin:0">This is usually a restrictive network on one side. Try switching to mobile data or a different network, then try again — you’ll rejoin the queue.</p>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2)">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-rejoin">Try again</button>' +
          '<button class="btn btn-secondary" style="min-height:44px" data-act="leave">Leave</button></div>');
    }
    if (pt.phase === "no-host"){
      return navBar(right) + centered(
        '<div class="card-kicker">No practitioner yet</div>' +
        '<h2 style="margin:0">The room is empty right now</h2>' +
        '<p class="card-body" style="margin:0">Nobody has opened this room. This page keeps checking — you’ll be connected the moment a practitioner opens it.</p>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2)">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-retry">Check again now</button>' +
          '<button class="btn btn-secondary" style="min-height:44px" data-act="leave">Back</button></div>');
    }
    if (pt.phase === "waiting"){
      return navBar(right) + '<div class="wrap" style="max-width:640px;padding:var(--space-8) var(--space-6)">' +
        '<div class="card elev-md" style="padding:var(--space-6);gap:var(--space-4);align-items:flex-start">' +
          '<div style="display:flex;align-items:center;gap:var(--space-3)">' + avatarHtml(pr.name || "Practitioner", 64, "accent") +
            '<div><div class="card-kicker">Waiting room</div><h3 style="margin:0">' + esc(pr.name || "The practitioner") + '</h3>' +
            (pr.title ? '<div style="font-size:13px;color:var(--color-accent-700)">' + esc(pr.title) + '</div>' : '') + '</div></div>' +
          '<h2 style="margin:0">Dear ' + esc(S.name || "there") + ',</h2>' +
          '<p style="margin:0;font-size:15px">' +
            (pt.pos && pt.pos > 1 ? "You are number " + pt.pos + " in the queue. " : "You’re next in the queue. ") +
            'Your practitioner will attend to you in the next few minutes. The room stays open the whole time — you’ll be pulled in automatically as soon as it’s your turn.</p>' +
          '<div style="display:flex;align-items:center;gap:var(--space-2);font-size:14px;color:var(--color-accent-700)">' +
            '<span class="dot-pulse fast" style="width:8px;height:8px;background:var(--color-accent)"></span><span>Holding your place…</span></div>' +
          '<button class="btn btn-secondary" data-act="leave">Leave the queue</button>' +
        '</div></div>';
    }
    if (pt.phase === "live"){
      return navBar(right) + '<div class="wrap" style="padding:var(--space-3) var(--space-6) var(--space-8)">' +
        '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start">' +
          '<div style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
            callStage(pr.name || "Practitioner", pr.title || "") +
            callControls("pt-hangup", "Hang up") +
            '<div class="card elev-sm" style="padding:var(--space-4);gap:var(--space-3)">' +
              '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap">' +
                '<div><div class="card-kicker">Live notes</div><h3 style="margin:0;font-size:18px">Notes from ' + esc(fn) + '</h3></div>' +
                '<span class="tag tag-accent-2">Streamed to you</span></div>' +
              notesList(pt.notes, fn + " adds notes here during the call. You keep them when it ends.") +
            '</div>' +
          '</div>' +
          '<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
            '<div class="card" style="padding:var(--space-4)">' +
              '<div class="card-kicker">Practitioner</div><div class="card-title">' + esc(pr.name || "In the room") + '</div>' +
              (pr.title ? '<p class="card-body" style="margin:0">' + esc(pr.title) + '</p>' : '') +
            '</div>' +
            '<div class="card" style="padding:var(--space-4);background:var(--color-accent-2-100)">' +
              '<div class="card-title" style="font-size:15px">When you hang up</div>' +
              '<p class="card-body" style="margin:0;color:var(--color-accent-2-800)">The room doesn’t close. ' + esc(fn) + ' stays online and the next patient is admitted straight away.</p></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    // ended
    var notes = pt.finalNotes || pt.notes || [];
    var mins = Math.max(1, Math.round((pt.lastDuration || 0) / 60000));
    var mailBody = encodeURIComponent(
      "Consultation with " + (pr.name || "your practitioner") + (pr.title ? " (" + pr.title + ")" : "") + "\n\n" +
      (notes.length ? notes.map(function(n){ return n.at + "   " + n.text; }).join("\n") : "No notes were sent.") + "\n"
    );
    return navBar(right) + '<div class="wrap" style="max-width:820px;padding:var(--space-6) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-4)">' +
      '<div><h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Call ended · ' + mins + ' min</h6>' +
        '<h1 style="font-size:clamp(30px,4vw,44px);margin:0;max-width:20ch">Here is what you agreed.</h1></div>' +
      '<div class="card elev-md" style="padding:var(--space-4);gap:var(--space-4)">' +
        '<div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">' + avatarHtml(pr.name || "Practitioner", 56, "accent2") +
          '<div style="min-width:0;flex:1"><div class="card-title">' + esc(pr.name || "Your practitioner") + '</div>' +
          (pr.title ? '<div style="font-size:13px;color:var(--color-accent-700)">' + esc(pr.title) + '</div>' : '') + '</div>' +
          '<span class="tag tag-neutral">' + esc(pt.endReason || "Call ended") + '</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:var(--space-3)">' +
          '<div class="card-kicker">Notes from ' + esc(fn) + '</div>' + notesList(notes, "No notes were sent during this call.") + '</div>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-rejoin">Rejoin ' + esc(fn) + '’s room</button>' +
          '<a class="btn btn-secondary" style="min-height:44px" href="mailto:?subject=' + encodeURIComponent("Notes from your consultation") + '&body=' + mailBody + '">Email these to me</a>' +
          '<button class="btn btn-ghost" style="min-height:44px" data-act="leave">Done</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function centered(inner){
    return '<div class="wrap" style="max-width:560px;padding:var(--space-8) var(--space-6)">' +
      '<div class="card elev-md" style="padding:var(--space-6);gap:var(--space-3);align-items:flex-start">' + inner + '</div></div>';
  }

  // ---- render ----------------------------------------------------------
  function attachStreams(){
    var o = host || pt; if (!o) return;
    var l = document.querySelector("video.js-local");
    var r = document.querySelector("video.js-remote");
    if (l && o.stream && l.srcObject !== o.stream){ l.srcObject = o.stream; var pl = l.play(); if (pl && pl.catch) pl.catch(function(){}); }
    if (r && o.remoteStream && r.srcObject !== o.remoteStream){ r.srcObject = o.remoteStream; var pr = r.play(); if (pr && pr.catch) pr.catch(function(){}); }
  }
  function render(){
    var body;
    if (S.screen === "host" && host) body = viewHost();
    else if (S.screen === "patient" && pt) body = viewPatient();
    else if (S.screen === "signin") body = viewSignin();
    else body = viewLanding();
    app.innerHTML = '<div style="min-height:100vh">' + body + '</div>' +
      (S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : '');
    attachStreams();
  }

  render();
})();
</script>
</body>
</html>
