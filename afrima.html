<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openroom — consulting rooms that never close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#ffffff;
    --color-text:#201e1d;
    --color-accent:#c67139;
    --color-accent-2:#7a8a5e;

    --color-accent-100:#f7e7d9;
    --color-accent-200:#eccbae;
    --color-accent-300:#e0ac85;
    --color-accent-400:#d38f5d;
    --color-accent-500:#c67139;
    --color-accent-600:#a95d2c;
    --color-accent-700:#89491f;
    --color-accent-800:#693819;
    --color-accent-900:#4a2712;

    --color-accent-2-100:#e9eddf;
    --color-accent-2-200:#d5ddc2;
    --color-accent-2-300:#bdc9a1;
    --color-accent-2-400:#a3b381;
    --color-accent-2-500:#7a8a5e;
    --color-accent-2-600:#66764e;
    --color-accent-2-700:#525f3f;
    --color-accent-2-800:#3f4a31;
    --color-accent-2-900:#2d3423;

    --color-neutral-100:#efe8da;
    --color-neutral-200:#e3dccb;
    --color-neutral-300:#cec6b2;
    --color-neutral-400:#a9a08b;
    --color-neutral-500:#7d7565;
    --color-neutral-600:#5b5447;
    --color-neutral-700:#403b31;
    --color-neutral-800:#2b2823;
    --color-neutral-900:#1c1a16;
    --color-divider:rgba(32,30,29,.12);

    --font-heading:"Caprasimo",Georgia,serif;
    --font-body:"Figtree",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;

    --space-1:5px; --space-2:9px; --space-3:13px; --space-4:18px;
    --space-5:26px; --space-6:35px; --space-7:46px; --space-8:64px;

    --radius-lg:16px;

    --shadow-sm:0 1px 2px rgba(32,30,29,.06),0 1px 3px rgba(32,30,29,.09);
    --shadow-md:0 4px 12px rgba(32,30,29,.10),0 2px 4px rgba(32,30,29,.06);
    --shadow-lg:0 18px 48px rgba(32,30,29,.18),0 6px 16px rgba(32,30,29,.10);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--color-bg);color:var(--color-text);
    font-family:var(--font-body);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:400;line-height:1.08;margin:0}
  h2{font-size:clamp(24px,3.3vw,33px)}
  h3{font-size:20px}
  h6{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--font-body);font-weight:700}
  p{margin:0}
  a{color:var(--color-accent-700);text-decoration:none}
  a:hover{color:var(--color-accent)}
  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
  img,video{max-width:100%;display:block}

  .wrap{max-width:1120px;margin:0 auto;padding-left:var(--space-6);padding-right:var(--space-6)}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
    flex-wrap:wrap;padding-top:var(--space-4);padding-bottom:var(--space-4)}
  .nav-brand{font-family:var(--font-heading);font-size:23px;color:var(--color-accent-700)}

  .btn{font:inherit;font-weight:600;font-size:14px;border-radius:999px;border:1px solid transparent;
    padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;line-height:1;transition:background .12s,color .12s,border-color .12s,transform .04s;text-align:center;
    text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--color-accent);color:#fff}
  .btn-primary:hover{background:var(--color-accent-600)}
  .btn-secondary{background:transparent;color:var(--color-text);border-color:color-mix(in srgb,var(--color-text) 22%,transparent)}
  .btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
  .btn-ghost{background:transparent;color:var(--color-accent-700);padding-inline:8px}
  .btn-ghost:hover{color:var(--color-accent)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:5px 11px;border-radius:999px;white-space:nowrap}
  .tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
  .tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
  .tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-700)}

  .card{display:flex;flex-direction:column;gap:var(--space-2);background:#ffffff;
    border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:var(--space-4)}
  .elev-sm{box-shadow:var(--shadow-sm)}
  .elev-md{box-shadow:var(--shadow-md)}
  .elev-lg{box-shadow:var(--shadow-lg)}
  .card-kicker{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--color-neutral-600)}
  .card-title{font-family:var(--font-heading);font-size:18px;line-height:1.15}
  .card-body{font-size:14px;color:var(--color-neutral-700);line-height:1.5}
  .card-meta{display:flex;gap:var(--space-2);font-size:13px;color:var(--color-neutral-600)}

  .field{display:flex;flex-direction:column;gap:6px}
  .field>label{font-size:13px;font-weight:600;color:var(--color-neutral-700)}
  .input{font:inherit;padding:11px 15px;border-radius:999px;border:1px solid color-mix(in srgb,var(--color-text) 20%,transparent);
    background:#fff;color:inherit;width:100%}
  .input:focus{outline:2px solid var(--color-accent);outline-offset:1px;border-color:transparent}

  .seg{display:inline-flex;background:var(--color-neutral-200);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
  .seg-opt{position:relative}
  .seg-opt input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
  .seg-opt span{display:block;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;
    color:var(--color-neutral-700);white-space:nowrap}
  .seg-opt input:checked+span{background:#fff;color:var(--color-text);box-shadow:var(--shadow-sm)}

  .washed{background:linear-gradient(155deg,var(--color-accent-200),var(--color-accent-2-200))}
  .text-muted{color:var(--color-neutral-600)}

  .avatar{border-radius:50%;display:grid;place-items:center;font-family:var(--font-heading);flex:none;line-height:1}
  .slot{display:grid;place-items:center;font-family:var(--font-heading);width:100%;height:100%;position:relative;overflow:hidden}
  .slot-video{color:var(--color-neutral-100);background:var(--color-neutral-800)}
  .selfcam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .js-remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--color-neutral-900)}

  .dot-pulse{border-radius:50%;animation:pulseDot 1.6s ease-in-out infinite}
  .dot-pulse.fast{animation-duration:1.4s}
  @keyframes pulseDot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.dot-pulse{animation:none}}

  .stage-label{position:absolute;pointer-events:none}
  .footer{border-top:1px solid var(--color-divider);margin-top:var(--space-8)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
    background:var(--color-neutral-900);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;box-shadow:var(--shadow-lg)}
  .banner{border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:14px}
  .banner-warn{background:#fdeee6;border:1px solid var(--color-accent-300);color:var(--color-accent-800)}
  .banner-err{background:#fdECEC;border:1px solid #e2a3a3;color:#8a2b2b}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  "use strict";

  var app = document.getElementById("app");

  // ---- room + connection config -------------------------------------------
  var params = new URLSearchParams(location.search);
  var ROOM = (params.get("room") || "main").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40) || "main";
  var HOST_ID = "openroom-" + ROOM + "-host";
  var SHARE_URL = location.origin + location.pathname + (ROOM === "main" ? "" : "?room=" + ROOM);

  // Google STUN for the common cases + OpenRelay's free public TURN so calls
  // still connect across strict/symmetric NATs and mobile networks.
  var ICE = { iceServers: [
    { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] },
    { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
    { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
  ]};

  var SECURE = (window.isSecureContext !== false) && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  var LIB_OK = (typeof Peer !== "undefined");

  // ---- helpers ----------------------------------------------------------
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function initials(n){
    var p = String(n || "").replace(/^Dr\.?\s*/i, "").trim().split(/\s+/).slice(0, 2);
    return p.map(function(w){ return w[0] || ""; }).join("").toUpperCase() || "–";
  }
  function first(n){ return String(n || "").replace(/^Dr\.?\s*/i, "").trim().split(/\s+/)[0] || "your practitioner"; }
  function mmss(s){ s = Math.max(0, s | 0); return Math.floor(s/60) + ":" + String(s%60).padStart(2, "0"); }
  function avatarHtml(name, size, kind){
    var bg = kind === "accent" ? "var(--color-accent-200)" : "var(--color-accent-2-200)";
    var fg = kind === "accent" ? "var(--color-accent-800)" : "var(--color-accent-2-800)";
    return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;background:' + bg +
      ';color:' + fg + ';font-size:' + Math.round(size * 0.34) + 'px">' + esc(initials(name)) + '</div>';
  }

  // ---- shared local camera/mic ---------------------------------------------
  var mediaP = null, mediaErr = false;
  function getMedia(){
    if (mediaP) return mediaP;
    mediaP = navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .catch(function(){ return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); })
      .catch(function(){ mediaErr = true; return null; });
    return mediaP;
  }
  function localStreamOf(o){ return o ? o.stream : null; }
  function applyToggles(){
    var o = host || pt; if (!o || !o.stream) return;
    o.stream.getAudioTracks().forEach(function(t){ t.enabled = !o.muted; });
    o.stream.getVideoTracks().forEach(function(t){ t.enabled = !o.camOff; });
  }

  // ---- session ---------------------------------------------------------
  var S = { screen: "landing", role: "patient", name: "", title: "General practitioner", err: "", toast: "" };
  var host = null;   // practitioner runtime
  var pt = null;     // patient runtime
  var noteDraft = "";

  // ============================ HOST ===================================
  function startHost(){
    host = {
      peer: null, ready: false, err: "", tries: 0,
      stream: undefined, muted: false, camOff: false, onBreak: false,
      clients: {}, queue: [], currentId: null, currentName: "", currentCall: null,
      remoteStream: null, notes: [], callStart: 0
    };
    S.screen = "host"; render();
    getMedia().then(function(s){ host.stream = s; applyToggles(); pump(); render(); });
    makeHostPeer();
  }
  function makeHostPeer(){
    var p = new Peer(HOST_ID, { config: ICE, debug: 1 });
    host.peer = p;
    p.on("open", function(){ host.ready = true; host.err = ""; host.tries = 0; render(); pump(); });
    p.on("connection", hostOnConn);
    p.on("disconnected", function(){ try { p.reconnect(); } catch (e) {} });
    p.on("error", function(e){
      if (e && e.type === "unavailable-id"){
        host.tries++;
        if (host.tries <= 6){
          host.err = "Reclaiming the room… (" + host.tries + ")";
          render();
          setTimeout(function(){ try { host.peer.destroy(); } catch (x) {} makeHostPeer(); }, 3000);
        } else {
          host.err = "Another practitioner already holds room “" + ROOM + "”. Ask them to close their tab, or add ?room=NAME to the link for a separate room.";
          render();
        }
      } else if (e && (e.type === "network" || e.type === "server-error" || e.type === "socket-error")){
        host.err = "Signalling connection dropped — retrying…"; render();
      } else {
        console.warn("[host]", e && e.type, e);
      }
    });
  }
  function hostOnConn(conn){
    conn.on("open", function(){
      host.clients[conn.peer] = { id: conn.peer, name: (conn.metadata && conn.metadata.name) || "Patient", conn: conn, at: Date.now() };
      try { conn.send({ t: "hello", name: S.name, title: S.title }); } catch (e) {}
      if (host.currentId !== conn.peer && host.queue.indexOf(conn.peer) < 0) host.queue.push(conn.peer);
      pump(); render();
    });
    conn.on("data", function(d){ if (d && d.t === "bye") hostDrop(conn.peer); });
    conn.on("close", function(){ hostDrop(conn.peer); });
    conn.on("error", function(){ hostDrop(conn.peer); });
  }
  function pump(){
    if (!host || !host.ready || host.stream === undefined) return;
    if (host.onBreak || host.currentId){ sendPositions(); return; }
    var id = host.queue.shift();
    if (!id){ render(); return; }
    var e = host.clients[id];
    if (!e){ return pump(); }
    host.currentId = e.id; host.currentName = e.name; host.notes = []; host.callStart = Date.now();
    try { e.conn.send({ t: "admit" }); } catch (x) {}
    var call = host.peer.call(e.id, host.stream || new MediaStream());
    host.currentCall = call;
    if (call){
      call.on("stream", function(rs){ host.remoteStream = rs; render(); });
      call.on("error", function(){});
    }
    sendPositions(); render();
  }
  function sendPositions(){
    host.queue.forEach(function(id, i){
      var e = host.clients[id];
      if (e && e.conn.open){ try { e.conn.send({ t: "pos", pos: i + 1 }); } catch (x) {} }
    });
  }
  function hostDrop(id){
    if (!host) return;
    var wasCurrent = host.currentId === id;
    delete host.clients[id];
    host.queue = host.queue.filter(function(x){ return x !== id; });
    if (wasCurrent){
      try { host.currentCall && host.currentCall.close(); } catch (x) {}
      host.currentId = null; host.currentName = ""; host.currentCall = null; host.remoteStream = null; host.notes = [];
      if (!host.onBreak) pump();
    }
    sendPositions(); render();
  }
  function hostEndConsult(){
    if (!host || !host.currentId) return;
    var e = host.clients[host.currentId];
    if (e && e.conn.open){
      try { e.conn.send({ t: "end", notes: host.notes.slice(), duration: Date.now() - host.callStart }); } catch (x) {}
    }
    try { host.currentCall && host.currentCall.close(); } catch (x) {}
    host.currentId = null; host.currentName = ""; host.currentCall = null; host.remoteStream = null; host.notes = [];
    render();
    setTimeout(function(){ pump(); render(); }, 500);
  }
  function hostSendNote(text){
    if (!host || !host.currentId) return;
    var at = mmss(Math.floor((Date.now() - host.callStart) / 1000));
    host.notes.push({ at: at, text: text });
    var e = host.clients[host.currentId];
    if (e && e.conn.open){ try { e.conn.send({ t: "note", at: at, text: text }); } catch (x) {} }
    noteDraft = ""; render();
  }
  function hostSetBreak(on){
    host.onBreak = on;
    if (on) hostEndConsult(); else pump();
    render();
  }

  // ========================== PATIENT =================================
  function startPatient(){
    pt = {
      peer: null, conn: null, currentCall: null,
      stream: undefined, muted: false, camOff: false, remoteStream: null,
      phase: "connecting", pos: 0, practitioner: { name: "", title: "" },
      notes: [], finalNotes: null, callStart: 0, lastDuration: 0, endReason: "", retry: 0
    };
    S.screen = "patient"; render();
    getMedia().then(function(s){ pt.stream = s; applyToggles(); connectPatient(); render(); });
  }
  function connectPatient(){
    var p = new Peer({ config: ICE, debug: 1 });
    pt.peer = p;
    p.on("open", function(){
      var conn = p.connect(HOST_ID, { metadata: { name: S.name }, reliable: true });
      pt.conn = conn;
      conn.on("open", function(){ if (pt.phase === "connecting") pt.phase = "waiting"; render(); });
      conn.on("data", ptOnData);
      conn.on("close", function(){
        if (pt.phase !== "ended"){
          pt.finalNotes = pt.finalNotes || pt.notes.slice();
          pt.endReason = pt.endReason || "The connection to the room closed.";
          pt.phase = "ended"; render();
        }
      });
      conn.on("error", function(){});
    });
    p.on("call", function(call){
      pt.currentCall = call;
      call.answer(pt.stream || new MediaStream());
      call.on("stream", function(rs){
        pt.remoteStream = rs; if (!pt.callStart) pt.callStart = Date.now();
        pt.phase = "live"; render();
      });
      call.on("close", function(){
        if (pt.phase === "live"){ pt.finalNotes = pt.finalNotes || pt.notes.slice(); pt.endReason = pt.endReason || "The practitioner ended the call."; pt.phase = "ended"; render(); }
      });
      call.on("error", function(){});
    });
    p.on("error", function(e){
      if (e && e.type === "peer-unavailable"){
        pt.phase = "no-host"; render();
        clearTimeout(pt._t);
        pt._t = setTimeout(function(){ if (pt && pt.phase === "no-host") rejoinPatient(); }, 5000);
      } else if (e && (e.type === "network" || e.type === "server-error")){
        if (pt.phase !== "live"){ pt.phase = "no-host"; render(); }
      } else {
        console.warn("[patient]", e && e.type, e);
      }
    });
  }
  function ptOnData(d){
    if (!d) return;
    if (d.t === "hello"){ pt.practitioner = { name: d.name || "", title: d.title || "" }; render(); }
    else if (d.t === "pos"){ pt.pos = d.pos; if (pt.phase === "waiting") render(); }
    else if (d.t === "admit"){ if (pt.phase === "waiting" || pt.phase === "connecting"){ pt.phase = "connecting"; render(); } }
    else if (d.t === "note"){ pt.notes.push({ at: d.at, text: d.text }); render(); }
    else if (d.t === "end"){
      pt.finalNotes = ((d.notes && d.notes.length) ? d.notes : pt.notes).slice();
      pt.lastDuration = d.duration || (pt.callStart ? Date.now() - pt.callStart : 0);
      pt.endReason = "The practitioner ended the call.";
      pt.phase = "ended"; render();
      try { pt.conn && pt.conn.close(); } catch (x) {}
    }
  }
  function ptHangUp(){
    try { pt.conn && pt.conn.open && pt.conn.send({ t: "bye" }); } catch (x) {}
    try { pt.currentCall && pt.currentCall.close(); } catch (x) {}
    pt.lastDuration = pt.callStart ? Date.now() - pt.callStart : 0;
    pt.finalNotes = pt.notes.slice();
    pt.endReason = "You left the call.";
    pt.phase = "ended"; render();
  }
  function rejoinPatient(){
    try { pt && pt.peer && pt.peer.destroy(); } catch (x) {}
    startPatient();
  }

  // ---- teardown / leave ------------------------------------------------
  function leaveAll(){
    try { host && host.peer && host.peer.destroy(); } catch (x) {}
    try { pt && pt.peer && pt.peer.destroy(); } catch (x) {}
    host = null; pt = null;
    S.screen = "landing"; render();
  }
  window.addEventListener("pagehide", function(){
    try { host && host.peer && host.peer.destroy(); } catch (x) {}
    try { pt && pt.peer && pt.peer.destroy(); } catch (x) {}
  });

  // ---- shared UI actions --------------------------------------------------
  function toggleMute(){ var o = host || pt; if (!o) return; o.muted = !o.muted; applyToggles(); render(); }
  function toggleCam(){ var o = host || pt; if (!o) return; o.camOff = !o.camOff; applyToggles(); render(); }
  function copyLink(){
    var done = function(){ S.toast = "Link copied"; render(); setTimeout(function(){ S.toast = ""; render(); }, 1600); };
    try { navigator.clipboard.writeText(SHARE_URL).then(done, done); } catch (e) { done(); }
  }

  // ---- events -------------------------------------------------------
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.dataset.act;
    if (a === "start"){
      if (!S.name.trim()){ S.err = "Enter your name first."; return render(); }
      S.err = "";
      if (S.role === "doctor") startHost(); else startPatient();
    }
    else if (a === "leave") leaveAll();
    else if (a === "copy") copyLink();
    else if (a === "mute") toggleMute();
    else if (a === "cam") toggleCam();
    else if (a === "host-end") hostEndConsult();
    else if (a === "host-break") hostSetBreak(true);
    else if (a === "host-open") hostSetBreak(false);
    else if (a === "pt-hangup") ptHangUp();
    else if (a === "pt-rejoin") rejoinPatient();
    else if (a === "pt-retry") rejoinPatient();
  });
  document.addEventListener("change", function(e){
    if (e.target.name === "role"){ S.role = e.target.value; render(); }
  });
  document.addEventListener("input", function(e){
    var f = e.target.dataset.field;
    if (f === "name") S.name = e.target.value;
    else if (f === "title") S.title = e.target.value;
    else if (e.target.classList.contains("js-note-input")) noteDraft = e.target.value;
  });
  document.addEventListener("submit", function(e){
    var f = e.target.closest(".js-note-form"); if (!f) return;
    e.preventDefault();
    var inp = f.querySelector(".js-note-input");
    var v = (inp && inp.value || "").trim();
    if (v) hostSendNote(v);
  });

  // ---- per-second clock (patches text only, never re-renders) ----------
  setInterval(function(){
    var el = document.querySelector(".js-timer"); if (!el) return;
    var start = (host && host.currentId) ? host.callStart : (pt && pt.phase === "live" ? pt.callStart : 0);
    if (start) el.textContent = mmss(Math.floor((Date.now() - start) / 1000));
    var idle = document.querySelector(".js-idle-count");
    if (idle && pt && pt.phase === "no-host") idle.textContent = "";
  }, 1000);

  // ============================ VIEWS =================================
  function navBar(right){
    return '<div class="wrap nav"><span class="nav-brand">Openroom</span>' +
      '<div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">' +
        (ROOM !== "main" ? '<span class="tag tag-neutral">room · ' + esc(ROOM) + '</span>' : '') +
        (right || '') +
      '</div></div>';
  }

  function shareRow(){
    return '<div class="card" style="gap:var(--space-2)">' +
      '<div class="card-kicker">Room link</div>' +
      '<div style="display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center">' +
        '<input class="input" style="flex:1;min-width:220px" readonly value="' + esc(SHARE_URL) + '" onclick="this.select()" />' +
        '<button class="btn btn-secondary" style="min-height:44px" data-act="copy">Copy link</button>' +
      '</div>' +
      '<p class="card-body" style="margin:0">Send this to anyone. They open it as a patient if your room is free, or as the practitioner if the room is empty.</p>' +
    '</div>';
  }

  function notesList(arr, emptyMsg){
    if (!arr || !arr.length) return '<p class="card-body" style="margin:0">' + esc(emptyMsg) + '</p>';
    return '<div style="display:flex;flex-direction:column">' + arr.map(function(n){
      return '<div style="display:flex;gap:var(--space-3);padding:6px 0;border-bottom:1px solid var(--color-divider)">' +
        '<span class="text-muted" style="font-size:12px;flex:none;width:44px">' + esc(n.at) + '</span>' +
        '<span style="font-size:14px">' + esc(n.text) + '</span></div>';
    }).join("") + '</div>';
  }

  function callStage(bigName, bigSub){
    var o = host || pt;
    var noCam = mediaErr || !o.stream;
    var camOff = o.camOff;
    return '<div style="position:relative;border-radius:32px;overflow:hidden;background:var(--color-neutral-800);aspect-ratio:16/10;box-shadow:var(--shadow-lg)">' +
      '<video class="js-remote" autoplay playsinline></video>' +
      '<div class="stage-label" style="left:var(--space-4);top:var(--space-4);display:flex;gap:var(--space-2);align-items:center">' +
        '<span class="tag js-timer" style="background:var(--color-neutral-900);color:var(--color-neutral-200)">0:00</span>' +
        '<span class="tag" style="background:var(--color-accent-700);color:var(--color-accent-100)">Live</span></div>' +
      '<div class="stage-label" style="left:var(--space-4);bottom:var(--space-4)">' +
        '<div style="font-family:var(--font-heading);font-size:20px;color:var(--color-neutral-100)">' + esc(bigName) + '</div>' +
        (bigSub ? '<div style="font-size:13px;color:var(--color-neutral-300)">' + esc(bigSub) + '</div>' : '') + '</div>' +
      '<div style="position:absolute;right:var(--space-4);bottom:var(--space-4);width:26%;min-width:120px;aspect-ratio:4/3;' +
        'border-radius:20px;overflow:hidden;background:var(--color-neutral-900);box-shadow:var(--shadow-md)">' +
        ((noCam || camOff)
          ? '<div class="slot slot-video" style="font-size:13px;color:var(--color-neutral-300)">' + (noCam ? "No camera" : "Camera off") + '</div>'
          : '<video class="js-local selfcam" autoplay playsinline muted></video>') +
      '</div>' +
    '</div>';
  }
  function callControls(endAct, endLabel){
    var o = host || pt;
    return '<div style="display:flex;justify-content:center;gap:var(--space-3);flex-wrap:wrap">' +
      '<button class="btn btn-secondary" style="min-height:44px;min-width:44px" data-act="mute">' + (o.muted ? "Unmute" : "Mute") + '</button>' +
      '<button class="btn btn-secondary" style="min-height:44px;min-width:44px" data-act="cam">' + (o.camOff ? "Camera on" : "Camera off") + '</button>' +
      '<button class="btn btn-primary" style="min-height:44px;background:var(--color-accent-700)" data-act="' + endAct + '">' + endLabel + '</button>' +
    '</div>';
  }

  // ---------------------------- landing -------------------------------
  function viewLanding(){
    var isDoc = S.role === "doctor";
    var warn = "";
    if (!LIB_OK) warn = '<div class="banner banner-err" style="margin-bottom:var(--space-4)">Couldn’t load the realtime library (peerjs). Check your connection and reload.</div>';
    else if (!SECURE) warn = '<div class="banner banner-warn" style="margin-bottom:var(--space-4)">Open this page over <b>https://</b> (or localhost). Camera and microphone access need a secure page — it won’t work from a local file.</div>';

    var joinCard =
      '<div class="card elev-md" style="padding:var(--space-6);gap:var(--space-4)">' +
        '<div><div class="card-kicker">Join this room</div><h3 style="margin:0">One link, two doors</h3></div>' +
        '<div class="seg" style="align-self:start">' +
          '<label class="seg-opt"><input type="radio" name="role" value="patient"' + (isDoc ? "" : " checked") + '/><span>I need care</span></label>' +
          '<label class="seg-opt"><input type="radio" name="role" value="doctor"' + (isDoc ? " checked" : "") + '/><span>I’m the practitioner</span></label>' +
        '</div>' +
        '<div class="field"><label>Your name</label>' +
          '<input class="input" data-field="name" value="' + esc(S.name) + '" placeholder="Full name" autocomplete="name" /></div>' +
        (isDoc
          ? '<div class="field"><label>Your title — patients see this</label>' +
            '<input class="input" data-field="title" value="' + esc(S.title) + '" placeholder="e.g. Nutritionist" /></div>'
          : '') +
        (S.err ? '<p style="margin:0;font-size:13px;color:#b3261e">' + esc(S.err) + '</p>' : '') +
        '<button class="btn btn-primary btn-block" style="min-height:46px"' + ((LIB_OK && SECURE) ? '' : ' disabled') + ' data-act="start">' +
          (isDoc ? "Open the room" : "Join the room") + '</button>' +
        '<p class="text-muted" style="font-size:12px;margin:0">' +
          (isDoc
            ? "You hold the room open. Patients join one at a time; when one leaves, the next is admitted — you stay connected throughout."
            : "If the practitioner is free you go straight in. If they’re with someone you wait in line and are pulled in automatically.") +
        '</p>' +
      '</div>';

    return navBar() +
    warn +
    '<div class="wrap" style="padding:var(--space-4) var(--space-6) var(--space-8);display:grid;' +
      'grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--space-8);align-items:center">' +
      '<div>' +
        '<h6 style="color:var(--color-accent-700);margin-bottom:var(--space-3)">Consulting rooms that never close</h6>' +
        '<h1 style="font-size:clamp(36px,5vw,60px);margin-bottom:var(--space-4);max-width:16ch">Someone is always in the room.</h1>' +
        '<p style="font-size:17px;max-width:46ch;text-wrap:pretty;margin-bottom:var(--space-5)">A practitioner opens a room and stays in it. ' +
          'Patients join the live video call over the same link — no booking. One hangs up, the room stays open, the next goes in.</p>' +
        joinCard +
      '</div>' +
      '<div style="position:relative;padding-bottom:var(--space-6);padding-left:var(--space-4)">' +
        '<div style="border-radius:999px 999px 40px 40px;overflow:hidden;aspect-ratio:4/5;box-shadow:var(--shadow-lg);background:var(--color-accent-200)">' +
          '<img src="hero.jpg" alt="A practitioner talking a patient through something on a tablet" ' +
            'style="width:100%;height:100%;object-fit:cover;object-position:38% 40%;display:block" />' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="wrap" style="padding:0 var(--space-6) var(--space-8)">' +
      '<h2 style="margin-bottom:var(--space-6);max-width:22ch">How a call happens</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--space-4)">' +
        step(1, "Open the room", "The practitioner opens the room once and shares the link. Their camera stays on between patients.") +
        step(2, "Join the call", "A free room takes the patient straight into a live video call. A busy one holds their place in line.") +
        step(3, "Hang up — the room stays", "The patient leaves with the notes from the call. The practitioner stays online and the next patient goes in.") +
      '</div>' +
    '</div>' +
    '<div class="footer"><div class="wrap" style="padding:var(--space-4) var(--space-6)">' +
      '<span class="text-muted" style="font-size:12px">Peer-to-peer video over WebRTC. No accounts, no recording, nothing stored on a server. ' +
      'Different link tab? add <code>?room=name</code> to run a separate room.</span>' +
    '</div></div>';
  }
  function step(n, title, body){
    return '<div class="card elev-sm" style="padding:var(--space-4);gap:var(--space-3)">' +
      '<div style="width:44px;height:44px;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);' +
        'display:grid;place-items:center;font-family:var(--font-heading);font-size:18px">' + n + '</div>' +
      '<div class="card-title">' + esc(title) + '</div>' +
      '<p class="card-body" style="margin:0">' + esc(body) + '</p></div>';
  }

  // ---------------------------- host ---------------------------------
  function viewHost(){
    var right = '<span class="tag tag-accent-2">Practitioner · ' + esc(S.name || "You") + '</span>' +
      '<button class="btn btn-secondary" data-act="leave">Close room</button>';
    var status = !host.ready
      ? '<span class="tag tag-neutral">Connecting…</span>'
      : host.currentId
        ? '<span class="tag tag-accent">In a call</span>'
        : host.onBreak
          ? '<span class="tag tag-neutral">On a break</span>'
          : '<span class="tag tag-accent-2">Room open</span>';

    var waitingCount = host.queue.length;
    var waitRows = waitingCount
      ? host.queue.map(function(id){
          var e = host.clients[id]; if (!e) return "";
          return '<div style="display:flex;align-items:center;gap:var(--space-3);padding:6px 0;border-bottom:1px solid var(--color-divider)">' +
            avatarHtml(e.name, 34, "accent") +
            '<div style="flex:1;min-width:0;font-size:14px;font-weight:600">' + esc(e.name) + '</div>' +
            '<span class="text-muted" style="font-size:12px">waiting</span></div>';
        }).join("")
      : '<p class="card-body" style="margin:0">Nobody waiting. The next person to open the link goes straight through.</p>';

    var stage;
    if (host.currentId){
      stage = callStage(host.currentName, "In a call with you") + callControls("host-end", "End consultation");
    } else {
      stage = '<div class="card elev-sm" style="aspect-ratio:16/10;justify-content:center;align-items:flex-start;' +
        'padding:var(--space-8);gap:var(--space-3);background:var(--color-neutral-200)">' +
        '<div style="display:flex;align-items:center;gap:var(--space-2)">' +
          '<span class="' + (host.onBreak ? '' : 'dot-pulse') + '" style="width:9px;height:9px;border-radius:50%;background:' +
            (host.onBreak ? 'var(--color-neutral-400)' : 'var(--color-accent-2-600)') + '"></span>' +
          '<span class="card-kicker" style="color:var(--color-accent-2-700)">' + (host.onBreak ? "On a break" : "Room open") + '</span></div>' +
        '<h3 style="margin:0;max-width:24ch">' + (host.onBreak ? "Your room is closed" : (waitingCount ? "Admitting the next patient…" : "Waiting for a patient")) + '</h3>' +
        '<p class="card-body" style="margin:0;max-width:42ch;flex:none">' +
          (host.onBreak
            ? "Patients can open the link but can’t join until you reopen. Anyone already waiting keeps their place."
            : "Your camera is on and the room is live at the link below. The moment someone joins, you’re connected.") + '</p>' +
        (host.onBreak
          ? '<button class="btn btn-primary" style="min-height:44px" data-act="host-open">Reopen the room</button>'
          : '') +
      '</div>';
    }

    var notesPanel = host.currentId
      ? '<div class="card elev-sm" style="padding:var(--space-4);gap:var(--space-3)">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap">' +
            '<div><div class="card-kicker">Live notes</div><h3 style="margin:0;font-size:18px">Notes for ' + esc(first(host.currentName)) + '</h3></div>' +
            '<span class="tag tag-accent-2">Streamed to the patient</span></div>' +
          notesList(host.notes, "Nothing sent yet. What you type appears on the patient’s screen instantly and is theirs to keep when the call ends.") +
          '<form class="js-note-form" style="display:flex;gap:var(--space-2)">' +
            '<input class="js-note-input input" autocomplete="off" placeholder="Type a note and press Enter" value="' + esc(noteDraft) + '" />' +
            '<button class="btn btn-primary" type="submit" style="min-height:44px">Send</button></form>' +
        '</div>'
      : '';

    return navBar(right) +
    (host.err ? '<div class="wrap" style="padding:0 var(--space-6)"><div class="banner banner-warn" style="margin-bottom:var(--space-4)">' + esc(host.err) + '</div></div>' : '') +
    '<div class="wrap" style="padding:var(--space-3) var(--space-6) var(--space-8)">' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)">' +
        '<div style="display:flex;align-items:center;gap:var(--space-3)">' + avatarHtml(S.name, 56, "accent2") +
          '<div><h6 style="color:var(--color-accent-700);margin-bottom:var(--space-1)">' + esc(S.title || "Practitioner") + '</h6>' +
          '<h2 style="margin:0">' + esc(S.name || "Your room") + '</h2></div></div>' +
        '<div style="display:flex;align-items:center;gap:var(--space-2)">' + status +
          (host.ready && !host.currentId
            ? (host.onBreak
                ? ''
                : '<button class="btn btn-secondary" data-act="host-break">Take a break</button>')
            : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start">' +
        '<div style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' + stage + notesPanel + '</div>' +
        '<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
          shareRow() +
          '<div class="card" style="padding:var(--space-4);gap:var(--space-3)">' +
            '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)">' +
              '<div class="card-title" style="font-size:15px">Waiting</div>' +
              '<span class="tag tag-accent">' + waitingCount + ' in line</span></div>' + waitRows +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // --------------------------- patient -------------------------------
  function viewPatient(){
    var right = '<span class="tag tag-accent-2">' + esc(S.name || "Patient") + '</span>' +
      '<button class="btn btn-secondary" data-act="leave">Leave</button>';
    var pr = pt.practitioner || { name: "", title: "" };
    var fn = first(pr.name);

    if (pt.phase === "connecting"){
      return navBar(right) + centered(
        '<div class="card-kicker">Connecting</div>' +
        '<h2 style="margin:0">Reaching the room…</h2>' +
        '<p class="card-body" style="margin:0">Setting up your camera and the secure connection.</p>');
    }
    if (pt.phase === "no-host"){
      return navBar(right) + centered(
        '<div class="card-kicker">No practitioner yet</div>' +
        '<h2 style="margin:0">The room is empty right now</h2>' +
        '<p class="card-body" style="margin:0">Nobody has opened this room. This page keeps checking — you’ll be connected the moment a practitioner opens it.</p>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2)">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-retry">Check again now</button>' +
          '<button class="btn btn-secondary" style="min-height:44px" data-act="leave">Back</button></div>');
    }
    if (pt.phase === "waiting"){
      return navBar(right) + '<div class="wrap" style="max-width:640px;padding:var(--space-8) var(--space-6)">' +
        '<div class="card elev-md" style="padding:var(--space-6);gap:var(--space-4);align-items:flex-start">' +
          '<div style="display:flex;align-items:center;gap:var(--space-3)">' + avatarHtml(pr.name || "Practitioner", 64, "accent") +
            '<div><div class="card-kicker">Waiting room</div><h3 style="margin:0">' + esc(pr.name || "The practitioner") + '</h3>' +
            (pr.title ? '<div style="font-size:13px;color:var(--color-accent-700)">' + esc(pr.title) + '</div>' : '') + '</div></div>' +
          '<h2 style="margin:0">' + (pt.pos ? "You are number " + pt.pos + " in the queue" : "You’re in the queue") + '</h2>' +
          '<p style="margin:0;font-size:15px">The room stays open the whole time. You’ll be pulled in automatically as soon as the person ahead hangs up.</p>' +
          '<div style="display:flex;align-items:center;gap:var(--space-2);font-size:14px;color:var(--color-accent-700)">' +
            '<span class="dot-pulse fast" style="width:8px;height:8px;background:var(--color-accent)"></span><span>Holding your place…</span></div>' +
          '<button class="btn btn-secondary" data-act="leave">Leave the queue</button>' +
        '</div></div>';
    }
    if (pt.phase === "live"){
      return navBar(right) + '<div class="wrap" style="padding:var(--space-3) var(--space-6) var(--space-8)">' +
        '<div style="display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start">' +
          '<div style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
            callStage(pr.name || "Practitioner", pr.title || "") +
            callControls("pt-hangup", "Hang up") +
          '</div>' +
          '<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:var(--space-3)">' +
            '<div class="card" style="padding:var(--space-4)">' +
              '<div class="card-kicker">Practitioner</div><div class="card-title">' + esc(pr.name || "In the room") + '</div>' +
              (pr.title ? '<p class="card-body" style="margin:0">' + esc(pr.title) + '</p>' : '') +
            '</div>' +
            '<div class="card" style="padding:var(--space-4);background:var(--color-accent-2-100)">' +
              '<div class="card-title" style="font-size:15px">When you hang up</div>' +
              '<p class="card-body" style="margin:0;color:var(--color-accent-2-800)">The room doesn’t close. ' + esc(fn) + ' stays online and the next patient is admitted straight away.</p></div>' +
            '<div class="card" style="padding:var(--space-4);gap:var(--space-3)">' +
              '<div class="card-kicker">Notes from ' + esc(fn) + '</div>' +
              notesList(pt.notes, esc(fn) + " adds notes here during the call. You keep them when it ends.") +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    // ended
    var notes = pt.finalNotes || pt.notes || [];
    var mins = Math.max(1, Math.round((pt.lastDuration || 0) / 60000));
    var mailBody = encodeURIComponent(
      "Consultation with " + (pr.name || "your practitioner") + (pr.title ? " (" + pr.title + ")" : "") + "\n\n" +
      (notes.length ? notes.map(function(n){ return n.at + "   " + n.text; }).join("\n") : "No notes were sent.") + "\n"
    );
    return navBar(right) + '<div class="wrap" style="max-width:820px;padding:var(--space-6) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-4)">' +
      '<div><h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Call ended · ' + mins + ' min</h6>' +
        '<h1 style="font-size:clamp(30px,4vw,44px);margin:0;max-width:20ch">Here is what you agreed.</h1></div>' +
      '<div class="card elev-md" style="padding:var(--space-4);gap:var(--space-4)">' +
        '<div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">' + avatarHtml(pr.name || "Practitioner", 56, "accent2") +
          '<div style="min-width:0;flex:1"><div class="card-title">' + esc(pr.name || "Your practitioner") + '</div>' +
          (pr.title ? '<div style="font-size:13px;color:var(--color-accent-700)">' + esc(pr.title) + '</div>' : '') + '</div>' +
          '<span class="tag tag-neutral">' + esc(pt.endReason || "Call ended") + '</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:var(--space-3)">' +
          '<div class="card-kicker">Notes from ' + esc(fn) + '</div>' + notesList(notes, "No notes were sent during this call.") + '</div>' +
        '<div style="display:flex;gap:var(--space-3);flex-wrap:wrap">' +
          '<button class="btn btn-primary" style="min-height:44px" data-act="pt-rejoin">Rejoin ' + esc(fn) + '’s room</button>' +
          '<a class="btn btn-secondary" style="min-height:44px" href="mailto:?subject=' + encodeURIComponent("Notes from your consultation") + '&body=' + mailBody + '">Email these to me</a>' +
          '<button class="btn btn-ghost" style="min-height:44px" data-act="leave">Done</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function centered(inner){
    return '<div class="wrap" style="max-width:560px;padding:var(--space-8) var(--space-6)">' +
      '<div class="card elev-md" style="padding:var(--space-6);gap:var(--space-3);align-items:flex-start">' + inner + '</div></div>';
  }

  // ---- render ----------------------------------------------------------
  function attachStreams(){
    var o = host || pt; if (!o) return;
    var l = document.querySelector("video.js-local");
    var r = document.querySelector("video.js-remote");
    if (l && o.stream && l.srcObject !== o.stream){ l.srcObject = o.stream; var pl = l.play(); if (pl && pl.catch) pl.catch(function(){}); }
    if (r && o.remoteStream && r.srcObject !== o.remoteStream){ r.srcObject = o.remoteStream; var pr = r.play(); if (pr && pr.catch) pr.catch(function(){}); }
  }
  function render(){
    var body;
    if (S.screen === "host" && host) body = viewHost();
    else if (S.screen === "patient" && pt) body = viewPatient();
    else body = viewLanding();
    app.innerHTML = '<div style="min-height:100vh">' + body + '</div>' +
      (S.toast ? '<div class="toast">' + esc(S.toast) + '</div>' : '');
    attachStreams();
  }

  render();
})();
</script>
</body>
</html>
