<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openroom — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="openroom.css">
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  var app = document.getElementById("app");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function initials(n){
    var p = String(n || "").replace(/^Dr\.?\s*/i, "").trim().split(/\s+/).slice(0, 2);
    return p.map(function(w){ return w[0] || ""; }).join("").toUpperCase() || "–";
  }
  function mmss(s){ s = Math.max(0, s | 0); return Math.floor(s/60) + ":" + String(s%60).padStart(2, "0"); }
  function ago(ms){
    var m = Math.max(0, Math.floor(ms / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    return Math.floor(m/60) + "h " + String(m%60).padStart(2,"0") + "m ago";
  }
  function api(path, opts){
    opts = opts || {};
    return fetch(path, Object.assign({ credentials: "same-origin" }, opts))
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, body: j }; }); });
  }

  var S = { screen: "login", err: "", rooms: [], log: [], notConfigured: false, logFilter: "" };
  var pollT = null;

  function login(password){
    S.err = "";
    api("/api/admin-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: password }) })
      .then(function(res){
        if (res.ok){ S.screen = "dash"; render(); startPolling(); }
        else { S.err = (res.body && res.body.error) || "Couldn't log in."; render(); }
      })
      .catch(function(){ S.err = "Couldn't reach the server."; render(); });
  }
  function logout(){
    stopPolling();
    api("/api/admin-logout", { method: "POST" }).finally(function(){
      S.screen = "login"; S.rooms = []; S.log = []; render();
    });
  }
  function startPolling(){
    stopPolling();
    poll();
    pollT = setInterval(poll, 4000);
  }
  function stopPolling(){ clearInterval(pollT); pollT = null; }
  function poll(){
    api("/api/admin-rooms").then(function(res){
      if (res.status === 401){ stopPolling(); S.screen = "login"; S.err = "Session expired — log in again."; return render(); }
      if (res.ok){ S.rooms = res.body.rooms || []; S.notConfigured = !!res.body.notConfigured; render(); }
    }).catch(function(){});
    api("/api/admin-log").then(function(res){
      if (res.ok){ S.log = res.body.log || []; render(); }
    }).catch(function(){});
  }
  function command(room, cmd, targetId){
    api("/api/admin-command", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: room, cmd: cmd, targetId: targetId })
    }).then(function(){ setTimeout(poll, 600); });
  }

  document.addEventListener("submit", function(e){
    var f = e.target.closest(".js-login-form");
    if (!f) return;
    e.preventDefault();
    var pw = f.querySelector("input[type=password]").value;
    if (pw) login(pw);
  });
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.dataset.act;
    if (a === "logout") logout();
    else if (a === "end-call") command(t.dataset.room, "end-call");
    else if (a === "close-room") { if (confirm("Close " + t.dataset.room + "'s room? They'll be disconnected.")) command(t.dataset.room, "close-room"); }
    else if (a === "remove-queued") command(t.dataset.room, "remove-queued", t.dataset.target);
    else if (a === "refresh") poll();
  });
  document.addEventListener("input", function(e){
    if (e.target.classList.contains("js-log-filter")){ S.logFilter = e.target.value; renderLogOnly(); }
  });

  function viewLogin(){
    return '<div class="wrap" style="max-width:420px;padding-top:15vh">' +
      '<div style="text-align:center;margin-bottom:var(--space-6)"><span class="nav-brand">Openroom admin</span></div>' +
      '<form class="js-login-form card elev-md" style="padding:var(--space-6);gap:var(--space-4)">' +
        '<div class="field"><label>Admin password</label>' +
          '<input class="input" type="password" autocomplete="current-password" autofocus /></div>' +
        (S.err ? '<p style="margin:0;font-size:13px;color:#b3261e">' + esc(S.err) + '</p>' : '') +
        '<button class="btn btn-primary btn-block" style="min-height:44px" type="submit">Log in</button>' +
      '</form>' +
    '</div>';
  }

  function roomCard(r){
    var statusTag = r.onBreak
      ? '<span class="tag tag-neutral">On a break</span>'
      : r.current ? '<span class="tag tag-accent">In a call</span>' : '<span class="tag tag-accent-2">Open</span>';
    var current = r.current
      ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;' +
          'padding:var(--space-3);background:var(--color-neutral-100);border-radius:12px">' +
          '<div><div style="font-weight:600;font-size:14px">' + esc(r.current.name) + '</div>' +
            '<div class="text-muted" style="font-size:12px">' + (r.current.seek ? esc(r.current.seek) + " · " : "") +
              mmss(Math.floor((Date.now() - r.current.callStart) / 1000)) + ' elapsed</div></div>' +
          '<button class="btn btn-secondary" data-act="end-call" data-room="' + esc(r.room) + '">End this call</button>' +
        '</div>'
      : '<p class="card-body" style="margin:0">No one in a call right now.</p>';
    var queueRows = (r.queue || []).length
      ? r.queue.map(function(q){
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:6px 0;border-bottom:1px solid var(--color-divider)">' +
            '<div style="font-size:13px">' + esc(q.name) + (q.seek ? ' <span class="text-muted">· ' + esc(q.seek) + '</span>' : '') + '</div>' +
            '<button class="btn btn-ghost" style="font-size:12px" data-act="remove-queued" data-room="' + esc(r.room) + '" data-target="' + esc(q.id) + '">Remove</button></div>';
        }).join("")
      : '';
    return '<div class="card elev-sm" style="gap:var(--space-3);padding:var(--space-4)">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap">' +
        '<div style="display:flex;align-items:center;gap:var(--space-3)">' +
          '<div class="avatar" style="width:44px;height:44px;background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-size:15px">' + esc(initials(r.practitioner.name)) + '</div>' +
          '<div><div class="card-title" style="font-size:16px">' + esc(r.practitioner.name || "(unnamed)") + '</div>' +
            '<div class="text-muted" style="font-size:12px">' + esc(r.practitioner.title || "") + ' · room ' + esc(r.room) + '</div></div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:var(--space-2)">' + statusTag +
          '<button class="btn btn-secondary" data-act="close-room" data-room="' + esc(r.room) + '">Close room</button></div>' +
      '</div>' +
      current +
      (queueRows ? '<div><div class="card-kicker" style="margin-bottom:6px">' + r.queue.length + ' waiting</div>' + queueRows + '</div>' : '') +
    '</div>';
  }

  function logTable(){
    var rows = S.log.filter(function(l){
      if (!S.logFilter) return true;
      var f = S.logFilter.toLowerCase();
      return (l.practitioner || "").toLowerCase().indexOf(f) > -1 || (l.patientName || "").toLowerCase().indexOf(f) > -1;
    });
    if (!rows.length) return '<p class="card-body" style="margin:0">No calls logged yet.</p>';
    return '<table class="adm-table"><thead><tr><th>Practitioner</th><th>Patient</th><th>Wanted</th><th>Duration</th><th>Ended</th></tr></thead><tbody>' +
      rows.map(function(l){
        var mins = Math.max(1, Math.round((l.endedAt - l.startedAt) / 60000));
        return '<tr><td>' + esc(l.practitioner) + (l.title ? ' <span class="text-muted">· ' + esc(l.title) + '</span>' : '') + '</td>' +
          '<td>' + esc(l.patientName) + '</td><td>' + esc(l.seek || "—") + '</td>' +
          '<td>' + mins + ' min</td><td>' + esc(ago(Date.now() - l.endedAt)) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  function viewDash(){
    var inCall = S.rooms.filter(function(r){ return r.current; }).length;
    var waiting = S.rooms.reduce(function(n, r){ return n + (r.queue ? r.queue.length : 0); }, 0);
    var notConfigured = S.notConfigured
      ? '<div class="wrap" style="padding-top:var(--space-3)"><div class="banner banner-warn">Storage isn’t connected yet (KV_REST_API_URL/KV_REST_API_TOKEN), so no rooms will show up here even once practitioners are online.</div></div>'
      : '';
    return '<div class="wrap nav"><span class="nav-brand">Openroom admin</span>' +
        '<div style="display:flex;gap:var(--space-3);align-items:center">' +
          '<button class="btn btn-ghost" data-act="refresh">Refresh</button>' +
          '<button class="btn btn-secondary" data-act="logout">Log out</button></div></div>' +
      notConfigured +
      '<div class="wrap" style="padding:var(--space-3) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-5)">' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3)">' +
          '<div class="adm-stat"><span class="card-meta">Practitioners online</span><b>' + S.rooms.length + '</b></div>' +
          '<div class="adm-stat"><span class="card-meta">Calls in progress</span><b>' + inCall + '</b></div>' +
          '<div class="adm-stat"><span class="card-meta">Patients waiting</span><b>' + waiting + '</b></div>' +
        '</div>' +
        '<div><h2 style="margin-bottom:var(--space-3)">Live rooms</h2>' +
          (S.rooms.length
            ? '<div style="display:flex;flex-direction:column;gap:var(--space-3)">' + S.rooms.map(roomCard).join("") + '</div>'
            : '<p class="card-body" style="margin:0">No practitioners are online right now.</p>') +
        '</div>' +
        '<div><div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3)">' +
          '<h2 style="margin:0">Recent calls</h2>' +
          '<input class="input js-log-filter" style="max-width:240px" placeholder="Filter by name…" value="' + esc(S.logFilter) + '" />' +
        '</div>' +
        '<div class="card" style="padding:var(--space-2) var(--space-4)" id="log-table">' + logTable() + '</div></div>' +
      '</div>';
  }
  function renderLogOnly(){
    var el = document.getElementById("log-table");
    if (el) el.innerHTML = logTable();
  }

  function render(){
    app.innerHTML = S.screen === "dash" ? viewDash() : viewLogin();
  }
  render();
})();
</script>
</body>
</html>
